name: toolapp

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-hardening: &hardening
  restart: unless-stopped
  logging: *logging
  security_opt:
    - no-new-privileges:true

services:
  nginx:
    <<: *hardening
    image: nginxinc/nginx-unprivileged:1.28-alpine
    depends_on:
      frontend: { condition: service_healthy }
      backend: { condition: service_healthy }
    ports:
      - "${HTTP_PORT:-8088}:8080"
      - "${HTTPS_PORT:-8443}:8443"
    environment:
      PUBLIC_HTTPS_PORT: ${HTTPS_PORT:-8443}
      NGINX_HSTS: ${NGINX_HSTS:-}
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/templates:/etc/nginx/templates:ro
      - ./nginx/snippets:/etc/nginx/snippets:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - media:/var/www/media:ro
    read_only: true
    tmpfs:
      - /tmp:uid=101,gid=101
      - /etc/nginx/conf.d:uid=101,gid=101
    cap_drop: [ALL]
    networks: [edge]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/nginx-health"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits: { cpus: "0.50", memory: 128M }

  frontend:
    <<: *hardening
    build:
      context: ./frontend
      target: runner
    image: toolapp-frontend:latest
    environment:
      INTERNAL_API_ORIGIN: http://backend:8000
      PUBLIC_URL: ${PUBLIC_URL}
      REVALIDATE_SECRET: ${REVALIDATE_SECRET}
    read_only: true
    tmpfs:
      - /tmp
      - /app/.next/cache:uid=1000,gid=1000,size=64m
    cap_drop: [ALL]
    networks: [edge]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits: { cpus: "1.00", memory: 512M }

  backend:
    <<: *hardening
    build:
      context: ./backend
      target: prod
    image: toolapp-backend:latest
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
      migrations: { condition: service_completed_successfully }
    environment:
      APP_ENV: production
      MYSQL_HOST: mysql
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      PUBLIC_URL: ${PUBLIC_URL}
      ACCESS_TOKEN_TTL: ${ACCESS_TOKEN_TTL:-900}
      FRONTEND_INTERNAL_URL: http://frontend:3000
      REVALIDATE_SECRET: ${REVALIDATE_SECRET}
    volumes:
      - media:/app/media
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    networks: [edge, internal]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health/live', timeout=3).status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits: { cpus: "1.00", memory: 512M }

  migrations:
    <<: *hardening
    restart: "no"
    build:
      context: ./backend
      target: prod
    image: toolapp-backend:latest
    command: ["sh", "-c", "alembic upgrade head && python -m app.seed"]
    depends_on:
      mysql: { condition: service_healthy }
    environment:
      APP_ENV: production
      MYSQL_HOST: mysql
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_MIGRATOR_USER}
      MYSQL_PASSWORD: ${MYSQL_MIGRATOR_PASSWORD}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    networks: [internal]
    deploy:
      resources:
        limits: { cpus: "0.50", memory: 256M }

  mysql:
    <<: *hardening
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      APP_DB_USER: ${MYSQL_USER}
      APP_DB_PASSWORD: ${MYSQL_PASSWORD}
      MIGRATOR_DB_USER: ${MYSQL_MIGRATOR_USER}
      MIGRATOR_DB_PASSWORD: ${MYSQL_MIGRATOR_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql/conf.d:/etc/mysql/conf.d:ro
      - ./mysql/initdb:/docker-entrypoint-initdb.d:ro
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_ROOT_PASSWORD\" mysqladmin ping -h 127.0.0.1 -uroot --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 60s
    deploy:
      resources:
        limits: { cpus: "1.00", memory: 768M }

  redis:
    <<: *hardening
    image: redis:8-alpine
    command: ["sh", "-c", "exec redis-server /usr/local/etc/redis/redis.conf --requirepass \"$$REDIS_PASSWORD\""]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    volumes:
      - redis-data:/data
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    networks: [internal]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits: { cpus: "0.50", memory: 192M }

  e2e:
    profiles: [e2e]
    build:
      context: ./frontend/e2e
    image: toolapp-e2e:latest
    network_mode: service:nginx
    environment:
      HOME: /tmp
      NODE_EXTRA_CA_CERTS: /ca/dev-ca.crt
      STACK_MODE: ${STACK_MODE:-dev}
    volumes:
      - ./frontend:/app:ro
      - ./frontend/e2e:/app/e2e
      - /app/e2e/node_modules
      - ./nginx/ca/dev-ca.crt:/ca/dev-ca.crt:ro
    read_only: true
    tmpfs:
      - /tmp
    init: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits: { cpus: "2.00", memory: 2G }

networks:
  edge: {}
  internal:
    internal: true

volumes:
  mysql-data:
  redis-data:
  media:

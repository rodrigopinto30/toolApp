# nginx-unprivileged image: runs as user "nginx" (uid 101), listens on 8080/8443.
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    log_format json escape=json '{"time":"$time_iso8601","request_id":"$request_id",'
        '"remote_addr":"$remote_addr","method":"$request_method","uri":"$request_uri",'
        '"status":$status,"bytes":$body_bytes_sent,"request_time":$request_time,'
        '"upstream":"$upstream_addr","upstream_time":"$upstream_response_time",'
        '"user_agent":"$http_user_agent"}';
    access_log /dev/stdout json;

    server_tokens off;
    sendfile on;
    tcp_nopush on;

    # --- Timeouts (slow clients / slowloris) ---
    client_header_timeout 10s;
    client_body_timeout   10s;
    send_timeout          15s;
    keepalive_timeout     15s;
    reset_timedout_connection on;

    # --- Size limits ---
    client_max_body_size        5m;
    client_header_buffer_size   1k;
    large_client_header_buffers 4 8k;

    # --- Compression ---
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/javascript
               application/xml image/svg+xml application/manifest+json;

    # --- Rate limiting (layer 1; the backend applies layer 2 with Redis) ---
    limit_req_zone  $binary_remote_addr zone=general:10m rate=30r/s;
    limit_req_zone  $binary_remote_addr zone=api:10m     rate=15r/s;
    limit_req_zone  $binary_remote_addr zone=auth:10m    rate=10r/m;
    limit_conn_zone $binary_remote_addr zone=perip:10m;
    limit_req_status  429;
    limit_conn_status 429;

    # WebSocket (Next.js HMR in dev) without breaking keepalive to upstreams.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      '';
    }

    upstream frontend {
        server frontend:3000;
        keepalive 16;
    }

    upstream backend {
        server backend:8000;
        keepalive 16;
    }

    include /etc/nginx/conf.d/*.conf;
}

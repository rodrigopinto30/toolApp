# Errors generated by nginx itself on /api/ answer JSON in the backend's shape
# ({code, message, request_id}); responses from the backend pass through unchanged.
error_page 413 = @api_payload_too_large;
# A 504 from nginx means the backend did not answer at all (the backend sends its own 504
# before proxy_read_timeout), so it is reported as unavailable too.
error_page 502 503 504 = @api_unavailable;

# Development override: hot reload, source code mounted as a volume, Mailpit.
services:
  nginx:
    environment:
      NGINX_HSTS: ""

  frontend:
    build:
      target: dev
    image: toolapp-frontend:dev
    environment:
      NODE_ENV: development
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    healthcheck:
      start_period: 120s
    deploy:
      resources:
        limits: { cpus: "2.00", memory: 1536M }

  backend:
    build:
      target: dev
    image: toolapp-backend:dev
    environment:
      APP_ENV: development
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
    volumes:
      - ./backend/app:/app/app:ro

  mailpit:
    image: axllent/mailpit:v1.27
    restart: unless-stopped
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
    ports:
      - "127.0.0.1:${MAILPIT_PORT:-8025}:8025"
    networks: [internal, edge]
    security_opt:
      - no-new-privileges:true

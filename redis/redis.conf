# The password is passed on the command line (--requirepass) from the environment variable.
bind 0.0.0.0
protected-mode yes
appendonly yes
appendfsync everysec
maxmemory 128mb
maxmemory-policy allkeys-lru
timeout 300
tcp-keepalive 60
# Dangerous commands disabled
rename-command FLUSHALL ""
rename-command FLUSHDB  ""
rename-command CONFIG   ""
rename-command DEBUG    ""
rename-command KEYS     ""
